name: Build and Deploy

on:
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/creativalab-peru/creativalab-web

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Para crear el tag de versión en el repo
      packages: write   # Para subir la imagen a GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. Calcular e incrementar versión
      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: minor

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 2. Build y push de la imagen
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:${{ steps.tag_version.outputs.new_tag }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:latest
          cache-to: type=inline

      # 3. Deploy a Dokku usando el tag de versión
      - name: Deploy to Dokku
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DOKKU_HOST }}
          username: root
          key: ${{ secrets.DOKKU_DEPLOY_KEY }}
          script: |
            dokku git:from-image ${{ secrets.DOKKU_APP }} \
              ${{ env.IMAGE }}:${{ steps.tag_version.outputs.new_tag }}
