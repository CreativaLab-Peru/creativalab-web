server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip para reducir peso de transferencia
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    # Cache agresivo para assets con hash en el nombre (JS/CSS de Vite/Bun build)
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html sin cache (para que las actualizaciones lleguen sin problemas)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA routing: primero el archivo, luego su versión .html (las rutas
    # prerenderizadas por scripts/prerender.mjs, que llevan sus
    # propios metadatos para las vistas previas de WhatsApp y LinkedIn) y al
    # final el index.html de la SPA.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Headers de seguridad básicos
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}